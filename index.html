<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Parking Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <style>
    /* ===== GENERAL ===== */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      background-image: url("background1.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== HEADER BOX (TITLE + LOGO) ===== */
    .header-box {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 15px 25px;
      margin-top: 40px;
      gap: 20px;
    }

    .header-title {
      font-size: 32px;
      font-weight: bold;
      color: #222;
    }

    .header-logo img {
      height: 120px; /* Bigger logo for PC */
    }

    /* ===== INFO BOX (SYSTEM STATUS, AVAILABLE, LAST UPDATED) ===== */
    .info-box {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.9);
      padding: 15px 20px;
      border-radius: 12px;
      text-align: left;
    }

    .info-box h2, .info-box h3 {
      margin: 5px 0;
      font-size: 16px;
      font-weight: normal;
      color: #222;
    }

    /* ===== CONTAINER & SPOTS ===== */
    .container {
      display: flex;
      justify-content: space-around;
      margin-top: 40px;
      padding: 20px;
      width: 100%;
      max-width: 900px;
    }

    .spot {
      width: 180px;
      background: rgba(255, 255, 255, 0.85);
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .label {
      font-size: 20px;
      font-weight: bold;
    }

    .circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: gray;
      margin: 15px auto;
      transition: background 0.3s ease;
    }

    .status {
      font-weight: bold;
      margin-top: 5px;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 768px) {

      /* Header box at top, title + logo vertical */
      .header-box {
        flex-direction: column;
        gap: 10px;
        padding: 15px;
        margin-top: 15px;
      }

      .header-title {
        font-size: 24px;
        text-align: center;
      }

      .header-logo img {
        height: 80px;
      }

      /* System info below header */
      .info-box {
        position: static;
        margin: 10px auto 20px;
        text-align: center;
      }

      .info-box h2, .info-box h3 {
        font-size: 14px;
      }

      /* Parking spots stacked */
      .container {
        flex-direction: column;
        gap: 20px;
        align-items: center;
      }

      .spot {
        width: 90%;
        max-width: 300px;
      }

      .circle {
        width: 100px;
        height: 100px;
      }

      .label {
        font-size: 18px;
      }

      .status {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER BOX -->
  <div class="header-box">
    <div class="header-title">Parking Spot Availability</div>
    <div class="header-logo">
      <img src="logo.png" alt="Logo">
    </div>
  </div>

  <!-- INFO BOX -->
  <div class="info-box">
    <h2 id="systemStatus" style="color: gray;">System status: Checking...</h2>
    <h2 id="count">Available: -- / 3</h2>
    <h3 id="updated">Last updated: --</h3>
  </div>

  <!-- PARKING SPOTS -->
  <div class="container">
    <div class="spot">
      <div class="label">P1</div>
      <div id="c1" class="circle"></div>
      <div id="s1" class="status">--</div>
    </div>

    <div class="spot">
      <div class="label">P2</div>
      <div id="c2" class="circle"></div>
      <div id="s2" class="status">--</div>
    </div>

    <div class="spot">
      <div class="label">P3</div>
      <div id="c3" class="circle"></div>
      <div id="s3" class="status">--</div>
    </div>
  </div>

  <script>
    /* ===== Firebase Init ===== */
    var firebaseConfig = {
      databaseURL: "https://esp32-parking-1c553-a6c2e-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
  
    firebase.initializeApp(firebaseConfig);
    var db = firebase.database();
  
    /* ===== System Online / Offline Detection ===== */
    const OFFLINE_TIMEOUT = 15; // seconds
  
    db.ref("/system").on("value", snapshot => {
      const system = snapshot.val();
      const statusEl = document.getElementById("systemStatus");
  
      if (!system || !system.lastSeen) {
        statusEl.innerText = "System status: OFFLINE";
        statusEl.style.color = "red";
        setUIEnabled(false);
        return;
      }
  
      const now = Math.floor(Date.now() / 1000);
      const diff = now - system.lastSeen;
  
      if (diff > OFFLINE_TIMEOUT) {
        statusEl.innerText = "System status: OFFLINE";
        statusEl.style.color = "red";
        setUIEnabled(false);
      } else {
        statusEl.innerText = "System status: ONLINE";
        statusEl.style.color = "green";
        setUIEnabled(true);
      }
    });
  
    /* ===== Parking Data ===== */
    db.ref("parking").on("value", snapshot => {
      const data = snapshot.val();
      if (!data) return;
  
      updateSpot("1", data.P1);
      updateSpot("2", data.P2);
      updateSpot("3", data.P3);
  
      document.getElementById("count").innerText =
        "Available: " + data.availableCount + " / 3";
  
      if (data.lastUpdate) {
        const date = new Date(data.lastUpdate * 1000);
        document.getElementById("updated").innerText =
          "Last updated: " + date.toLocaleTimeString();
      }
    });
  
    function updateSpot(id, spot) {
      let circle = document.getElementById("c" + id);
      let status = document.getElementById("s" + id);
  
      if (spot.status === "Occupied") {
        circle.style.background = "red";
        status.innerText = "Occupied";
        status.style.color = "red";
      } else {
        circle.style.background = "green";
        status.innerText = "Available";
        status.style.color = "green";
      }
    }
  
    function setUIEnabled(enabled) {
      document.querySelector(".container").style.opacity = enabled ? "1" : "0.4";
    }
  </script>

</body>
</html>
